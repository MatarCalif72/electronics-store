name: Send full project snapshot

on:
  workflow_dispatch:

jobs:
  send-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Prepare full project snapshot
        run: |
          mkdir -p email_attachments

          # Directory structure
          echo "FULL PROJECT SNAPSHOT" > email_attachments/directory.txt
          echo "=====================" >> email_attachments/directory.txt
          echo "Triggered by: ${{ github.actor }}" >> email_attachments/directory.txt
          echo "Branch: ${{ github.ref_name }}" >> email_attachments/directory.txt
          echo "Commit: ${{ github.sha }}" >> email_attachments/directory.txt
          echo "" >> email_attachments/directory.txt
          echo "DIRECTORY STRUCTURE:" >> email_attachments/directory.txt
          find . -not -path './.git/*' | sort >> email_attachments/directory.txt

          # Copy every file in the repo
          find . -type f -not -path './.git/*' | while IFS= read -r file; do
            safe_name=$(echo "$file" | sed 's|/|_|g' | sed 's|^\./||')
            cp "$file" "email_attachments/${safe_name}.txt"
          done

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          to: opsagentsmonday@gmail.com
          from: ${{ secrets.EMAIL_USER }}
          subject: "[ElectroShop] Full project snapshot by ${{ github.actor }}"
          body: |
            This is a full snapshot of the entire project.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Attached:
            - directory.txt — full repo structure
            - One .txt file for every file in the project
          attachments: email_attachments/*
